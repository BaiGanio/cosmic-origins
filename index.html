<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Origins — Unified Data Hub of the Known Universe</title>
  <meta name="description" content="Filter, search, browse and read deep telemetry on galaxies, nebulae, exoplanets, clusters, stars, solar system bodies and exotic objects.">

  <!-- Type: Chakra Petch (display) · IBM Plex Sans (body) · IBM Plex Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="styles/cosmic.css" rel="stylesheet">
  <script>
    /* Opening a link to one object (#obj/...)? Keep the page dark until the
       detail view is ready, so the gallery does not flash up first.
       Safety net: show the page anyway after 3 seconds. */
    if (location.hash.indexOf("#obj/") === 0) {
      document.documentElement.classList.add("opening-detail");
      setTimeout(function () { document.documentElement.classList.remove("opening-detail"); }, 3000);
    }
  </script>
</head>
<body>

  <!-- ambient starfield (canvas; disabled under reduced motion / low ambience) -->
  <canvas id="starfield" aria-hidden="true"></canvas>

  <div class="app-shell">

    <!-- ================= TOP BAR: brand (= gallery link) + Ambience ================= -->
    <header class="topbar">
      <a class="brand" href="#" aria-label="Cosmic Origins, back to the gallery">
        <svg class="brand-mark" width="30" height="30" viewBox="0 0 34 34" fill="none" aria-hidden="true">
          <circle class="mark-ion" cx="17" cy="17" r="6" stroke-width="1.2"/>
          <ellipse class="mark-signal" cx="17" cy="17" rx="14" ry="5.5" stroke-width="0.9" transform="rotate(-24 17 17)"/>
          <circle class="mark-signal-dot" cx="28.5" cy="11.5" r="1.6"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Cosmic Origins</span>
          <span class="brand-sub">Unified Data Hub</span>
        </span>
      </a>
      <button class="ambience-btn" id="ambienceBtn" aria-pressed="true"
              title="Moving starfield in the background">
        <i class="bi bi-star-half" aria-hidden="true"></i><span>Ambience</span>
      </button>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="content">

      <!-- ---------- GALLERY ---------- -->
      <section class="view is-active" id="view-gallery" aria-label="Object gallery">

        <!-- full-bleed featured observation carousel -->
        <div class="hero" id="hero" aria-label="Featured observations">
          <div id="heroSlides"></div>
          <div class="hero-scrim"></div>
          <div class="hero-caption">
            <div class="hero-eyebrow">Featured observation</div>
            <h1 class="hero-name" id="heroName"></h1>
            <div class="hero-desig" id="heroDesig"></div>
            <button class="search-btn" id="heroOpen">Open telemetry</button>
          </div>
          <button class="hero-nav hero-prev" id="heroPrev" aria-label="Previous observation">‹</button>
          <button class="hero-nav hero-next" id="heroNext" aria-label="Next observation">›</button>
          <div class="hero-dots" id="heroDots"></div>
        </div>

        <div class="search-row">
          <input class="search-input" id="searchInput" type="search"
                 placeholder="Search designation — Andromeda, M 16, Kepler-186f"
                 aria-label="Search objects">
        </div>

        <div class="pill-row" role="group" aria-label="Category filters">
          <button class="pill" id="pillAll" aria-pressed="true">All</button>
          <button class="pill" data-cat="galaxy" aria-pressed="true">Galaxies</button>
          <button class="pill" data-cat="nebula" aria-pressed="true">Nebulae</button>
          <button class="pill" data-cat="cluster" aria-pressed="true">Clusters</button>
          <button class="pill" data-cat="star" aria-pressed="true">Stars</button>
          <button class="pill" data-cat="exoplanet" aria-pressed="true">Exoplanets</button>
          <button class="pill" data-cat="solar_system" aria-pressed="true">Solar System</button>
          <button class="pill" data-cat="exotic" aria-pressed="true">Exotic</button>
          <button class="pill pill--fav" id="pillFav" aria-pressed="false">Favorites</button>
        </div>

        <div class="data-notice" id="dataNotice" role="status" hidden></div>
        <div class="result-count" id="resultCount" aria-live="polite"></div>
        <div class="uao-grid" id="uaoGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none"></div>
      </section>

      <!-- ---------- DETAIL VIEWER: full-screen observation ---------- -->
      <section class="view detail-overlay" id="view-detail" aria-label="Object telemetry">
        <div class="detail-hero">
          <!-- the photo is a real link: click, middle-click or "open in new tab"
               all open the original NASA file -->
          <a class="detail-img-link" id="detailImgLink" target="_blank" rel="noopener"
             aria-label="Open the original picture in a new tab">
            <img id="detailImg" alt="">
          </a>
          <div class="hero-scrim"></div>
          <button class="detail-back" id="detailBack">◂ Back to gallery</button>
          <span class="detail-live">Catalog record</span>
          <div class="detail-caption">
            <h2 class="detail-title" id="detailTitle"></h2>
            <div class="detail-desig" id="detailDesig"></div>
            <div class="detail-credit" id="detailCredit"></div>
          </div>
          <button class="hero-nav hero-prev" id="detailPrev" aria-label="Previous object">‹</button>
          <button class="hero-nav hero-next" id="detailNext" aria-label="Next object">›</button>
          <button class="scroll-hint" id="scrollHint" aria-label="Scroll down to the telemetry">
            <span>Telemetry</span>
            <i class="bi bi-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="detail-content">
          <p class="data-notice" id="detailNotice" role="status" hidden></p>
          <dl class="telemetry" id="telemetry"></dl>
          <p class="detail-desc" id="detailDesc"></p>
          <div id="photoWrap">
            <div class="section-label" id="photoLabel"></div>
            <div class="photo-list" id="photoList"></div>
          </div>
          <div id="sourceWrap">
            <div class="section-label">Data sources</div>
            <ul class="source-list" id="sourceList"></ul>
          </div>
          <div id="relatedWrap">
            <div class="related-label" id="relatedLabel"></div>
            <div class="related-rail" id="relatedRail"></div>
          </div>
        </div>
      </section>

      <!-- ---------- NOT FOUND: a link to an object that does not exist ---------- -->
      <section class="view" id="view-notfound" aria-label="Object not found">
        <div class="panel-wrap brackets notfound">
          <div class="panel-eyebrow">404 · no signal</div>
          <h2 class="panel-title">Object not found</h2>
          <p>The catalog has no object called <code id="notFoundSlug"></code>.</p>
          <button class="search-btn" onclick="location.hash=''">Back to gallery</button>
        </div>
      </section>

    </main>

    <!-- The footer (credits + privacy links) comes here with issue #6. -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="src/core/api-config.js"></script>
  <script src="src/ui/cosmic.js"></script>
</body>
</html>
